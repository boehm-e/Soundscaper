name: Android APK

on:
  push:
    branches: [main, 'feat/android', 'android/**']
    tags: ['android-v*']
  pull_request:
    paths:
      - 'android/**'
      - 'src/**'
      - 'scripts/**'
      - 'tests/android-*'
      - 'public/**'
      - 'config/**'
      - 'vendor/**'
      - 'package*.json'
      - 'capacitor.config.json'
      - 'vite.config.mjs'
      - '.github/workflows/android.yml'
  workflow_dispatch:
    inputs:
      signed_release:
        description: Build a signed release APK and Play Store AAB using repository secrets
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      ANDROID_VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install pinned npm and dependencies
        run: |
          npm install --global npm@12.0.1
          npm ci
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Verify Android export and packaging adapters
        run: npm run test:android
      - name: Build bundled Android application
        run: npm run android:sync
      - name: Build and lint debug APK
        run: ./android/gradlew -p android assembleDebug lintDebug --no-daemon
      - name: Upload installable debug APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: soundscaper-android-debug-${{ github.sha }}
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify editor in Android WebView
        uses: reactivecircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808 # v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_7
          disable-animations: true
          emulator-options: -no-window -gpu swangle -feature -Vulkan -noaudio -no-boot-anim -no-snapshot
          script: npm run android:smoke
      - name: Collect Android test evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: soundscaper-android-evidence-${{ github.sha }}
          path: |
            .android-build/evidence/
            android/app/build/reports/lint-results-debug.html
          include-hidden-files: true
      - name: Prepare release signing key
        if: github.event_name == 'workflow_dispatch' && inputs.signed_release
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/soundscaper-release.jks"
          chmod 600 "$RUNNER_TEMP/soundscaper-release.jks"
      - name: Build signed release APK and AAB
        if: github.event_name == 'workflow_dispatch' && inputs.signed_release
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/soundscaper-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./android/gradlew -p android assembleRelease bundleRelease --no-daemon
      - name: Upload signed release
        if: github.event_name == 'workflow_dispatch' && inputs.signed_release
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: soundscaper-android-release-${{ github.run_number }}
          path: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
      - name: Remove release signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/soundscaper-release.jks"
